# WhiteNight persona LoRA training baseline for stage 9 (ms-swift).
#
# Before a real run, verify the installed ms-swift CLI and documentation, then
# copy this baseline into model/runs/<run-id>/.
# Freeze the visual tower to protect image-understanding capability.

# --- Model and data ---
model: Qwen/Qwen3-VL-8B-Instruct
train_type: lora
dataset: model/data/splits/train.jsonl
val_dataset: model/data/splits/val.jsonl
output_dir: model/runs/persona-v1

# --- Visual tower freeze; image capability remains a regression gate ---
freeze_vit: true
freeze_aligner: false

# --- LoRA ---
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
target_modules: all-linear

# --- Training hyperparameters: 8B, one GPU with at least 24 GiB ---
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 2.0e-5
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
logging_steps: 5
save_steps: 200
eval_steps: 200
save_total_limit: 3

# --- Evaluation without a resident persona prompt ---
eval_strategy: steps
report_to: tensorboard
